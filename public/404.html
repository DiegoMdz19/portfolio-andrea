<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada · Andrea López</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230e0e0d'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='13' font-style='italic' fill='%23c8b89a'>AL</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;cursor:none !important;}

:root{
  --ink:#0e0e0d;
  --paper:#f5f2ed;
  --warm:#c8b89a;
  --mid:#7a7068;
}

html,body{
  height:100%;
  background:#080706;
  color:#f0ece4;
  font-family:'Outfit',sans-serif;
  font-weight:200;
  overflow:hidden;
}

/* ── CANVAS DE PARTÍCULAS ── */
#canvas{
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
}

/* ── CURSOR ── */
.cursor{position:fixed;width:8px;height:8px;background:#f0ece4;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s;}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(240,236,228,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,opacity .3s;}
.cursor.hover{transform:translate(-50%,-50%) scale(0);}
.cursor-ring.hover{width:56px;height:56px;opacity:.15;}
@media(max-width:480px){.cursor,.cursor-ring{display:none;}}

/* ── CONTENIDO ── */
.wrap{
  position:relative;z-index:1;
  height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:40px;
  gap:0;
}

.num{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(8rem,20vw,18rem);
  font-weight:300;
  line-height:.85;
  color:transparent;
  -webkit-text-stroke:1px rgba(200,184,154,.25);
  letter-spacing:-.02em;
  opacity:0;
  animation:fadeUp .8s .2s cubic-bezier(.25,.46,.45,.94) forwards;
  user-select:none;
}

.titulo{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.2rem,3vw,2rem);
  font-weight:300;
  font-style:italic;
  color:#f0ece4;
  margin-top:8px;
  opacity:0;
  animation:fadeUp .7s .5s cubic-bezier(.25,.46,.45,.94) forwards;
}

.subtitulo{
  font-size:.72rem;
  font-weight:200;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(200,184,154,.5);
  margin-top:20px;
  opacity:0;
  animation:fadeUp .7s .7s cubic-bezier(.25,.46,.45,.94) forwards;
}

.separador{
  width:40px;height:1px;
  background:rgba(200,184,154,.3);
  margin:32px auto;
  opacity:0;
  animation:fadeUp .5s .9s forwards;
}

.links{
  display:flex;gap:32px;flex-wrap:wrap;justify-content:center;
  opacity:0;
  animation:fadeUp .7s 1s cubic-bezier(.25,.46,.45,.94) forwards;
}

.link-btn{
  font-family:'Outfit',sans-serif;
  font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
  text-decoration:none;
  color:rgba(240,236,228,.5);
  border-bottom:1px solid rgba(200,184,154,.2);
  padding-bottom:4px;
  transition:color .3s,border-color .3s;
  font-weight:300;
}
.link-btn:hover{color:#f0ece4;border-color:var(--warm);}
.link-btn.primary{color:var(--warm);border-color:var(--warm);}
.link-btn.primary:hover{color:#f0ece4;}

.firma{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;
  font-size:.75rem;font-style:italic;
  color:rgba(200,184,154,.2);
  letter-spacing:.12em;
  white-space:nowrap;
  opacity:0;
  animation:fadeUp .5s 1.2s forwards;
}

/* Línea decorativa animada */
.linea-wrap{
  position:fixed;left:40px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:fadeIn .8s 1s forwards;
}
.linea{width:1px;height:80px;background:linear-gradient(to bottom,transparent,rgba(200,184,154,.3),transparent);}
.punto{width:3px;height:3px;border-radius:50%;background:var(--warm);opacity:.5;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Cursor personalizado -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Línea decorativa -->
<div class="linea-wrap">
  <div class="punto"></div>
  <div class="linea"></div>
  <div class="punto"></div>
</div>

<div class="wrap">
  <p class="num">404</p>
  <p class="titulo">Este encuadre no existe</p>
  <p class="subtitulo">La página que buscas se perdió en el horizonte</p>
  <div class="separador"></div>
  <div class="links">
    <a href="" class="link-btn primary">← Volver al inicio</a>
    <a href="#galeria" class="link-btn">Ver galería</a>
    <a href="#contacto" class="link-btn">Contacto</a>
  </div>
</div>

<p class="firma">Andrea López · Fotografía & Vídeo</p>

<script>
// ── CURSOR ────────────────────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;

document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
(function anim(){
  rx += (mx-rx)*.12; ry += (my-ry)*.12;
  cursor.style.left=mx+'px'; cursor.style.top=my+'px';
  ring.style.left=rx+'px';   ring.style.top=ry+'px';
  requestAnimationFrame(anim);
})();
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('mouseenter', () => { cursor.classList.add('hover'); ring.classList.add('hover'); });
  a.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); ring.classList.remove('hover'); });
});

// ── PARTÍCULAS DE FONDO ────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, particles = [];

function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

// Crear partículas tipo polvo cinematográfico
for(let i = 0; i < 80; i++){
  particles.push({
    x:     Math.random() * innerWidth,
    y:     Math.random() * innerHeight,
    r:     Math.random() * 1.2 + 0.2,
    vx:    (Math.random() - .5) * .3,
    vy:    -(Math.random() * .4 + .1),
    alpha: Math.random() * .4 + .05,
  });
}

function drawParticles(){
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(200,184,154,${p.alpha})`;
    ctx.fill();
    p.x += p.vx; p.y += p.vy;
    if(p.y < -5)  { p.y = H + 5; p.x = Math.random() * W; }
    if(p.x < -5)  p.x = W + 5;
    if(p.x > W+5) p.x = -5;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ── CURSOR NATIVO OCULTO ──────────────────────────────────────────────────────
document.addEventListener('mouseover', e => {
  e.target.style.setProperty('cursor','none','important');
}, true);
</script>
</body>
</html>
